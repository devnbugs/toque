name: Build and Deploy Toque

on:
  #push:
    branches: [main]
    paths:
      - "src/**"
      - "bin/**"
      - "test/**"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "wrangler.jsonc"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref (branch/tag/SHA) to deploy"
        required: false
        default: ""
      rollback_image:
        description: "Existing image to roll back to (skips build)"
        required: false
        default: ""

env:
  NODE_VERSION: "26"

# Prevent overlapping deployments for the same branch; queue pushes
concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Build & push container image to Cloudflare's managed registry
  # (uses wrangler containers build -p — same command as local deploy)
  # ---------------------------------------------------------------------------
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.rollback_image == '' }}
    permissions:
      contents: read

    outputs:
      image: ${{ steps.build.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push to Cloudflare registry
        id: build
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          TAG="$(git rev-parse --short=7 HEAD)"
          IMAGE_NAME="toque:${TAG}"
          echo "Building image: ${IMAGE_NAME}"
          # wrangler containers build -p builds locally and pushes to
          # registry.cloudflare.com/<ACCOUNT_ID>/<IMAGE_NAME>
          # The -t flag takes "name:tag" — the name becomes the registry repo.
          OUTPUT=$(npx wrangler containers build -p -t "$IMAGE_NAME" . 2>&1 | tee /dev/stderr)
          # Extract the registry URI from the push output.
          IMAGE=$(echo "$OUTPUT" | grep -oE 'registry\.cloudflare\.com/[a-zA-Z0-9._/-]+:[a-zA-Z0-9._-]+' | head -n1)
          if [ -z "$IMAGE" ]; then
            # Fallback: construct from account ID + image name
            ACCOUNT_ID=$(npx wrangler whoami 2>/dev/null | grep -oE '[a-f0-9]{32}' | head -1)
            if [ -n "$ACCOUNT_ID" ]; then
              IMAGE="registry.cloudflare.com/${ACCOUNT_ID}/${IMAGE_NAME}"
              echo "Constructed image URI from account ID: $IMAGE"
            fi
          fi
          if [ -z "$IMAGE" ]; then
            echo "❌ Could not extract registry URI from wrangler output"
            exit 1
          fi
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          echo "Pushed image: $IMAGE"

  # ---------------------------------------------------------------------------
  # Deploy Worker + container to Cloudflare (gated by environment)
  # ---------------------------------------------------------------------------
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    needs: build-and-push
    if: always()
    environment:
      name: ${{ github.ref_name }}
      url: ${{ steps.deploy.outputs.url }}
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Resolve image to deploy
        id: resolve
        env:
          ROLLBACK_IMAGE: ${{ github.event.inputs.rollback_image }}
          BUILT_IMAGE: ${{ needs.build-and-push.outputs.image }}
        run: |
          if [ -n "$ROLLBACK_IMAGE" ]; then
            echo "Rolling back to: $ROLLBACK_IMAGE"
            echo "image=$ROLLBACK_IMAGE" >> "$GITHUB_OUTPUT"
          else
            echo "Deploying built image: $BUILT_IMAGE"
            echo "image=$BUILT_IMAGE" >> "$GITHUB_OUTPUT"
          fi

      - name: Patch wrangler.jsonc with image reference
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          # Use the same char-by-char JSONC stripper as scripts/deploy.sh to
          # safely handle // inside strings (e.g. https://) and trailing
          # commas left by comment-only lines.
          node -e '
            const fs = require("fs");
            const path = "wrangler.jsonc";
            const raw = fs.readFileSync(path, "utf8");
            let inString = false, escape = false, stripped = "";
            for (let i = 0; i < raw.length; i++) {
              const ch = raw[i], next = raw[i + 1];
              if (escape) { stripped += ch; escape = false; continue; }
              if (ch === "\\" && inString) { stripped += ch; escape = true; continue; }
              if (ch === "\"") { inString = !inString; stripped += ch; continue; }
              if (!inString && ch === "/" && next === "/") {
                while (i < raw.length && raw[i] !== "\n") i++;
                continue;
              }
              if (!inString && ch === "/" && next === "*") {
                i += 2;
                while (i < raw.length - 1 && !(raw[i] === "*" && raw[i + 1] === "/")) i++;
                i++;
                continue;
              }
              stripped += ch;
            }
            stripped = stripped.replace(/,(\s*[\]}])/g, "$1");
            const json = JSON.parse(stripped);
            if (!json.containers || !json.containers[0]) throw new Error("No container config found");
            json.containers[0].image = process.env.IMAGE;
            fs.writeFileSync(path, JSON.stringify(json, null, 2) + "\n");
            console.log("Patched wrangler.jsonc:");
            console.log(fs.readFileSync(path, "utf8"));
          '

      - name: Deploy to Cloudflare
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx wrangler deploy
          # The Worker URL uses the account's workers.dev subdomain (decloud),
          # not the branch name. Extract it from wrangler output.
          echo "url=https://toque.decloud.workers.dev" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        if: always()
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
          SHA: ${{ github.sha }}
        run: |
          echo "## Deployment Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | \`${IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Commit | [\`${SHA::7}\`](${{ github.server_url }}/${{ github.repository }}/commit/${SHA}) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Branch | \`${{ github.ref_name }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| URL | ${{ steps.deploy.outputs.url }} |" >> "$GITHUB_STEP_SUMMARY"
